<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minesweeper</title><style>body{background:#c0c0c0;color:#111;font:13px Tahoma,Arial;text-align:center;margin:16px}button,select{font:inherit}header{display:flex;justify-content:space-between;align-items:center;max-width:360px;margin:12px auto;padding:10px;border:3px inset #eee}.counter{background:#181818;color:#ff3232;font:bold 25px monospace;padding:3px 7px}#board{display:grid;margin:auto;width:min(360px,100%);border:4px inset #eee}#board button{aspect-ratio:1;border:3px outset #eee;background:#c0c0c0;font:bold clamp(14px,4vw,22px) monospace;padding:0}#board .open{border:1px solid #999;background:#d0d0d0}button:focus-visible{outline:2px solid #0752df;outline-offset:-3px}#status{min-height:34px}#flag[aria-pressed=true]{background:#ffe78c}p{line-height:1.6}</style><body><label>Difficulty <select id="level"><option value="9,10">Beginner · 10 mines</option><option value="12,24">Intermediate · 24 mines</option></select></label><header><span class="counter" id="left">010</span><button id="reset" aria-label="New game">🙂</button><span class="counter" id="timer">000</span></header><div id="board" aria-label="Minefield"></div><p id="status" role="status">Find the safe squares. Your first move is safe.</p><button id="flag" aria-pressed="false">🚩 Flag mode</button><p>Click to reveal. Right-click to flag.<br>On touch screens, turn on Flag mode.<br>Keyboard: Tab to a square, Enter to play.</p><script>
let n,mines,cells,started,ended,flags,t0,flagMode=false;const board=document.querySelector('#board'),status=document.querySelector('#status');
function reset(){[n,mines]=document.querySelector('#level').value.split(',').map(Number);cells=Array.from({length:n*n},()=>({mine:false,open:false,flag:false,count:0}));started=ended=false;flags=0;t0=0;board.style.gridTemplateColumns=`repeat(${n},1fr)`;board.innerHTML='';cells.forEach((c,i)=>{const b=document.createElement('button');b.setAttribute('aria-label',`Row ${Math.floor(i/n)+1}, column ${i%n+1}, hidden`);b.onclick=()=>flagMode?mark(i):reveal(i);b.oncontextmenu=e=>{e.preventDefault();mark(i)};board.append(b)});document.querySelector('#reset').textContent='🙂';document.querySelector('#timer').textContent='000';status.textContent='Find the safe squares. Your first move is safe.';paint()}
function neighbors(i){const a=[];for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++){let r=Math.floor(i/n)+y,c=i%n+x;if((x||y)&&r>=0&&r<n&&c>=0&&c<n)a.push(r*n+c)}return a}
function seed(first){let allowed=cells.map((_,i)=>i).filter(i=>i!==first&&!neighbors(first).includes(i));for(let i=allowed.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[allowed[i],allowed[j]]=[allowed[j],allowed[i]]}allowed.slice(0,mines).forEach(i=>cells[i].mine=true);cells.forEach((c,i)=>c.count=neighbors(i).filter(j=>cells[j].mine).length);started=true;t0=Date.now()}
function mark(i){if(ended||cells[i].open)return;cells[i].flag=!cells[i].flag;flags+=cells[i].flag?1:-1;paint()}
function reveal(i){if(ended||cells[i].flag||cells[i].open)return;if(!started)seed(i);if(cells[i].mine){ended=true;cells.forEach(c=>{if(c.mine)c.open=true});status.textContent='Boom! Try again with the smiley button.';document.querySelector('#reset').textContent='😵'}else{const queue=[i];while(queue.length){const j=queue.pop(),c=cells[j];if(c.open||c.flag||c.mine)continue;c.open=true;if(!c.count)queue.push(...neighbors(j))}if(cells.filter(c=>!c.mine).every(c=>c.open)){ended=true;status.textContent='You cleared the minefield! Well played.';document.querySelector('#reset').textContent='😎'}else status.textContent=`${cells.filter(c=>c.open).length} safe squares revealed.`}paint()}
function paint(){document.querySelector('#left').textContent=String(mines-flags).padStart(3,'0');cells.forEach((c,i)=>{const b=board.children[i];b.className=c.open?'open':'';b.textContent=c.open?(c.mine?'💣':c.count||''):(c.flag?'🚩':'');b.style.color=['','#0000bc','#008000','#e00000','#000080','#800000','#008080'][c.count]||'#111';b.setAttribute('aria-label',`Row ${Math.floor(i/n)+1}, column ${i%n+1}, ${c.open?(c.mine?'mine':c.count+' adjacent mines'):c.flag?'flagged':'hidden'}`)})}
document.querySelector('#reset').onclick=reset;document.querySelector('#level').onchange=reset;document.querySelector('#flag').onclick=e=>{flagMode=!flagMode;e.target.setAttribute('aria-pressed',flagMode)};setInterval(()=>{if(started&&!ended)document.querySelector('#timer').textContent=String(Math.min(999,Math.floor((Date.now()-t0)/1000))).padStart(3,'0')},250);reset();
</script></body></html>
