<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Cadet Pinball</title><style>body{margin:0;background:#131529;color:#e8ecff;font:12px Tahoma,Arial;text-align:center}header{display:flex;justify-content:space-around;gap:8px;padding:10px;background:#232946}strong{color:#65f6ff}canvas{display:block;margin:auto;max-width:100%;max-height:60vh;touch-action:none;background:#10152c}button{padding:10px 16px;background:linear-gradient(#fff,#c4c8dc);border:2px outset #eee;color:#17223a;font:bold 12px Tahoma;touch-action:none}nav{display:flex;justify-content:center;gap:8px;padding:8px}p{margin:6px 10px;line-height:1.5}#status{color:#ffe486}</style><body><header><span>SPACE CADET · MINI PINBALL</span><span>Score <strong id="score">0</strong></span><span>Balls <strong id="balls">3</strong></span></header><canvas width="400" height="560" tabindex="0" aria-label="Pinball table. Left and right arrow keys control flippers. Space launches."></canvas><nav><button id="left" aria-label="Left flipper">◀ Left</button><button id="launch">Launch</button><button id="right" aria-label="Right flipper">Right ▶</button><button id="new">New</button></nav><p id="status" role="status">Launch to play. Hit the bumpers and keep the ball out of the drain.</p><p>← / → or A / D: flippers · Space: launch · P: pause<br>An original mini table inspired by the Windows classic.</p><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let score=0,balls=3,ball,waiting=true,paused=false,left=false,right=false,last=0;const bumpers=[{x:130,y:150,r:25},{x:270,y:150,r:25},{x:200,y:235,r:28}],stars=Array.from({length:65},()=>[Math.random()*400,Math.random()*560]);const status=document.querySelector('#status');
function reset(){score=0;balls=3;paused=false;left=right=false;ready();hud()}
function ready(){waiting=true;ball={x:350,y:465,vx:0,vy:0};status.textContent=balls?'Ready! Launch your next ball.':'Game over. Press New to play again.'}
function hud(){document.querySelector('#score').textContent=score;document.querySelector('#balls').textContent=balls}
function launch(){if(waiting&&balls){waiting=false;ball.vy=-730;ball.vx=-150;status.textContent='Keep it flying!'}}
function flippers(){return [[105,465,195,left?435:495,left],[295,465,205,right?435:495,right]]}
function lineCollision(ax,ay,bx,by,boost=0){let dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((ball.x-ax)*dx+(ball.y-ay)*dy)/(dx*dx+dy*dy))),px=ax+t*dx,py=ay+t*dy,nx=ball.x-px,ny=ball.y-py,d=Math.hypot(nx,ny);if(d<14){if(d<.001){nx=0;ny=-1;d=1}nx/=d;ny/=d;ball.x=px+nx*14;ball.y=py+ny*14;const dot=ball.vx*nx+ball.vy*ny;if(dot<0){ball.vx-=1.8*dot*nx;ball.vy-=1.8*dot*ny;if(boost){ball.vy=-570;ball.vx+=(200-ball.x)*2}}}}
function update(dt){ball.vy+=440*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<24){ball.x=24;ball.vx=Math.abs(ball.vx)*.9}if(ball.x>376){ball.x=376;ball.vx=-Math.abs(ball.vx)*.9}if(ball.y<24){ball.y=24;ball.vy=Math.abs(ball.vy)*.9}for(const b of bumpers){let dx=ball.x-b.x,dy=ball.y-b.y,d=Math.hypot(dx,dy);if(d<b.r+8){const nx=dx/(d||1),ny=dy/(d||1);ball.x=b.x+nx*(b.r+9);ball.y=b.y+ny*(b.r+9);const dot=ball.vx*nx+ball.vy*ny;ball.vx-=2*dot*nx;ball.vy-=2*dot*ny;ball.vx+=nx*120;ball.vy+=ny*120;score+=100;hud()}}lineCollision(24,350,105,465);lineCollision(376,350,295,465);for(const f of flippers())lineCollision(...f);ball.vx=Math.max(-700,Math.min(700,ball.vx));ball.vy=Math.max(-850,Math.min(850,ball.vy));if(ball.y>580){balls--;hud();ready()}}
function line(x,y,a,b,color,width){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke()}
function draw(){ctx.clearRect(0,0,400,560);ctx.fillStyle='#7593ba';stars.forEach(([x,y])=>ctx.fillRect(x,y,1,1));ctx.strokeStyle='#7080b8';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(20,535);ctx.lineTo(20,65);ctx.quadraticCurveTo(20,20,65,20);ctx.lineTo(335,20);ctx.quadraticCurveTo(380,20,380,65);ctx.lineTo(380,535);ctx.stroke();ctx.textAlign='center';ctx.fillStyle='#7d91c5';ctx.font='bold 20px monospace';ctx.fillText('ORBIT CONTROL',200,85);for(const b of bumpers){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle='#492d80';ctx.fill();ctx.strokeStyle='#ee83ff';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#ffe18b';ctx.font='bold 16px monospace';ctx.fillText('100',b.x,b.y+6)}line(24,350,105,465,'#68dcf3',9);line(376,350,295,465,'#68dcf3',9);for(const [x,y,a,b,on]of flippers()){line(x,y,a,b,'#dce4ff',14);line(x,y,a,b,on?'#ffdc7b':'#ed6d84',8)}ctx.fillStyle='#a0adc9';ctx.font='12px monospace';ctx.fillText('DRAIN',200,550);const g=ctx.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,9);g.addColorStop(0,'white');g.addColorStop(1,'#778597');ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,8,0,Math.PI*2);ctx.fill();if(paused){ctx.fillStyle='#10152ccc';ctx.fillRect(0,0,400,560);ctx.fillStyle='white';ctx.font='24px monospace';ctx.fillText('PAUSED · Press P',200,290)}}
function frame(t){let dt=Math.min((t-last)/1000||0,.035);last=t;if(!paused&&!waiting&&document.visibilityState==='visible'&&(!frameElement||!frameElement.closest('.window')?.hidden)){for(let i=0;i<4&&!waiting;i++)update(dt/4)}draw();requestAnimationFrame(frame)}
function key(e,on){if(['ArrowLeft','ArrowRight',' ','a','d','p'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')left=on;if(e.key==='ArrowRight'||e.key==='d')right=on;if(on&&!e.repeat&&e.key===' ')launch();if(on&&!e.repeat&&e.key==='p')paused=!paused}}
addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));addEventListener('blur',()=>{left=right=false});for(const id of ['left','right']){const b=document.getElementById(id);b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);if(id==='left')left=true;else right=true};b.onpointerup=b.onpointercancel=()=>{if(id==='left')left=false;else right=false}}document.querySelector('#launch').onclick=launch;document.querySelector('#new').onclick=reset;reset();requestAnimationFrame(frame);
</script></body></html>
